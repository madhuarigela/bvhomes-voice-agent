[project]
name = "bvhomes-voice-agent"
version = "0.1.0"
description = "BVHomes Furniture multilingual (Telugu/English/Hindi) voice sales agent on LiveKit"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[google]~=1.7",
    "livekit-plugins-sarvam>=1.6",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "livekit-plugins-openai>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# Only needed if BVHOMES_LLM_PROVIDER=ollama (local LLM via Ollama's
# OpenAI-compatible endpoint). Not required for the default Gemini path.
ollama = [
    "livekit-plugins-openai>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
